<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleHeader.css">
    <link rel="shortcut icon" type="image/x-icon" href="Images/logo (1).png">
    <title>Le Goût de Montreal</title>
</head>
<body>
    <header>
        <div id="navpage">
            <nav id="navbar">
                <img src="Images/logo (1).png" alt="Logo MMI" id="logo">
                <h1>Le Goût de Montreal</h1>
                <ul id="navlinks">
                    <li><a href="">Accueil</a></li>
                    <li><a href="">Catalogue</a></li>
                    <li><a href="">Communauté</a></li>
                    <li><a href="">Contact</a></li>
                </ul>
                <div id="search">
                    <div id="select">
                        <p id="select_options"></p>
                        <img src="Images/barre-de-menu.png">
                        <ul id="list_options">
                            <li class="options">Fast Food</li>
                            <li class="options">Thaïlandais</li>
                            <li class="options">Vietnamien</li>
                            <li class="options">Grecque</li>
                            <li class="options">Tunisien</li>
                            <li class="options">Végétarien</li>
                            <li class="options">Pizza</li>
                            <li class="options">Sushis</li>
                            <li class="options">Italien</li>
                            <li class="options">Poké</li>
                            <li class="options">Street Food</li>
                            <li class="options">Fruits de mer</li>
                        </ul>
                    </div>
                    <input type="text" id="search_input" placeholder="Rechercher un restaurant, une spécialité...">
                </div>
                <button id="login">Se connecter</button>
            </nav>
        </div>
    </header>




    <script src="scriptHeader.js"></script>
</body>
</html>
